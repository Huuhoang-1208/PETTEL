server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 12m;

    # The Vue SPA will be served from backend/public/owner after the frontend build.
    # Keep Laravel's /reset-password POST endpoint while sending emailed GET links to Vue.
    location = /reset-password {
        if ($request_method = POST) {
            rewrite ^ /index.php?$query_string last;
        }
        rewrite ^ /owner/reset-password$is_args$args last;
    }

    location = /owner {
        return 301 /owner/;
    }

    location ^~ /owner/ {
        index index.html;
        try_files $uri $uri/ /owner/index.html;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
