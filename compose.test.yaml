services:
  db-test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pettel_test
      MYSQL_USER: pettel_test
      MYSQL_PASSWORD: pettel-test-only
      MYSQL_ROOT_PASSWORD: pettel-test-root
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  test:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db-test
      DB_PORT: 3306
      DB_DATABASE: pettel_test
      DB_USERNAME: pettel_test
      DB_PASSWORD: pettel-test-only
      DB_URL: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BCRYPT_ROUNDS: 4
    depends_on:
      db-test:
        condition: service_healthy
    volumes:
      - ./artifacts/coverage:/coverage
    command:
      - sh
      - -ec
      - |
        touch .env
        php artisan config:clear
        php artisan migrate:fresh --seed --force
        php artisan db:seed --force
        mkdir -p /coverage
        set +e
        vendor/bin/phpunit \
          --coverage-text \
          --coverage-clover=/coverage/clover.xml \
          --coverage-html=/coverage/html
        phpunit_status=$$?
        composer ci:check
        checks_status=$$?
        if [ "$$phpunit_status" -ne 0 ]; then exit "$$phpunit_status"; fi
        exit "$$checks_status"
