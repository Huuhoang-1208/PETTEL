name: Backend CI

on:
  push:
    branches:
      - main
      - be-ha01
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Format, analyse, migrate, seed and test
        run: docker compose -p pettel-test -f compose.test.yaml run --build --rm test

      - name: Show test database logs on failure
        if: failure()
        run: docker compose -p pettel-test -f compose.test.yaml logs --no-color db-test

      - name: Clean up test environment
        if: always()
        run: docker compose -p pettel-test -f compose.test.yaml down -v --remove-orphans
